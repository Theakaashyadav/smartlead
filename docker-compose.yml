services:
  setup:
    build: .
    env_file: .env
    environment:
      DATABASE_PROVIDER: mongodb
      DEMO_MODE: "false"
    command: [npm, run, db:setup]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_PROVIDER: mongodb
      DEMO_MODE: "false"
      WHATSAPP_LOGIN_MODE: background
    command: [npm, run, start:web]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_PROVIDER: mongodb
      DEMO_MODE: "false"
      WHATSAPP_LOGIN_MODE: background
      WHATSAPP_PROFILE_DIR: /app/data/whatsapp-web
      WHATSAPP_SESSION_DIR: /app/runtime-sessions
      CHROME_PATH: /usr/bin/chromium
    command: [npm, run, worker]
    volumes: [browser-runtime:/app/data]
    tmpfs: [/app/runtime-sessions:uid=1000,gid=1000,mode=0700]
    shm_size: 256mb
    depends_on:
      setup: {condition: service_completed_successfully}
    init: true
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, npm, run, worker:check]
      interval: 30s
      timeout: 20s
      start_period: 60s
      retries: 3
    restart: unless-stopped
volumes:
  browser-runtime:
